<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FraudShield</title>

    <style>
        body {
            width: 300px;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #F5F8FA;
        }

        h2 {
            text-align: center;
            color: #000;
            font-size: 18px;
            margin-top: 0;
        }

        .container {
            text-align: center;
        }

        #riskBox {
            background-color: #90A4AE;
            border-radius: 8px;
            color: #fff;
            padding: 14px;
            text-align: center;
            margin: 10px 0 18px;
            min-height: 70px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #1E88E5;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            margin-top: 6px;
        }

        button:hover {
            background-color: #1565C0;
        }

        .url-input {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #B0BEC5;
            margin-bottom: 6px;
            box-sizing: border-box;  /* ✔ Fixes input overflow */
        }

        .divider {
            text-align: center;
            font-weight: bold;
            color: #D32F2F;
            margin: 10px 0;
        }

        .footer {
            font-size: 9px;
            text-align: center;
            margin-top: 18px;
            opacity: 0.7;
        }
    </style>

</head>

<body>

    <div class="container">

        <h2>FraudShield - Website Risk Score</h2>

        <div id="riskBox">
            <p><strong>Risk Score:</strong></p>
            <p id="riskScoreText"></p>
        </div>

        <button id="scanBtn">Scan Current Website</button>

        <div class="divider">OR</div>

        <h3>Check a Website URL</h3>
        <input id="manualUrl" type="text" placeholder="https://example.com" class="url-input">
        <button id="checkBtn">Check Website</button>

        <p class="footer">ML Powered by FraudShield Backend</p>

    </div>

    <script src="popup.js"></script>
</body>
</html>
